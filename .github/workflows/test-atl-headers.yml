name: Windows ATL Header Smoke Test.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-atl-headers.yml'
      - 'atl-test/**'

jobs:

  windows:
    name: ATL headers (x64_x86)
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    steps:
      - name: Clone.
        uses: actions/checkout@v6

      - name: Install Visual Studio Build Tools
        shell: pwsh
        run: |
          Write-Host "Installing VS 2026 Build Tools..."
          choco install visualstudio2026buildtools `
            --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.ATL --add Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL --add Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64 --add Microsoft.VisualStudio.Component.VC.14.44.17.14.CLI.Support --includeRecommended --quiet" `
            -y --ignore-package-exit-codes=3010
          Write-Host "VS 2026 Build Tools installation completed"

      # Pinned to the exact same commit/inputs used by win_release.yml.
      - uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        name: Native Tools Command Prompt.
        with:
          arch: x64_x86
          sdk: 10.0.26100.0
          toolset: 14.44

      - name: Show environment.
        run: |
          echo INCLUDE=%INCLUDE%
          where cl.exe
          where ninja.exe

      - name: Configure.
        run: |
          cmake -B build -G Ninja -S atl-test

      - name: Build.
        run: |
          cmake --build build --verbose

      - name: Run.
        run: |
          build\atl_test.exe
